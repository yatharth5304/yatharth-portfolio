# Local dev profile — uses H2 in-memory DB so no external credentials needed.
# Run with: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local

spring.datasource.url=jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Flyway for local — H2 doesn't have the prod migrations
spring.flyway.enabled=false

spring.h2.console.enabled=true

# Admin credentials (any value works locally)
spring.security.user.name=admin
spring.security.user.password=admin

server.port=8080
